<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumen — виртуальное казино</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06050f;--ink:#f3f1ff;--mute:#a9a5cc;--violet:#8b5cf6;--cyan:#22d3ee;--pink:#f472b6;--mint:#34d399;--red:#fb4b6a;--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
body::before{width:60vmax;height:60vmax;left:-20vmax;top:-20vmax;background:radial-gradient(circle,#6d28d9,transparent 65%)}
body::after{width:55vmax;height:55vmax;right:-18vmax;bottom:-22vmax;background:radial-gradient(circle,#0891b2,transparent 65%);animation-delay:-8s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
h1,h2,h3,.disp{font-family:Unbounded,Manrope,sans-serif;font-weight:700;letter-spacing:-.01em}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--line);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.04),0 24px 60px rgba(0,0,0,.45)}
.pad{padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:16px;font-weight:800;background:linear-gradient(120deg,var(--violet),var(--cyan));box-shadow:0 0 26px rgba(139,92,246,.5),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s,box-shadow .15s,opacity .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 36px rgba(34,211,238,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);box-shadow:none}
.btn.big{padding:16px 30px;font-size:17px;width:100%}
.chip{padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:600;font-size:14px;transition:background .15s}
.chip:hover{background:rgba(255,255,255,.16)}
.chip.on{background:rgba(139,92,246,.35);border-color:var(--violet);box-shadow:0 0 16px rgba(139,92,246,.45)}
input[type=text],input[type=password],input[type=number]{width:100%;padding:13px 16px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:0;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
label{display:block;color:var(--mute);font-size:13px;margin:0 0 6px 2px}
.muted{color:var(--mute)}

/* вход */
#auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.authbox{width:min(440px,100%)}
.logo{font-size:clamp(40px,10vw,64px);background:linear-gradient(100deg,#fff,#c4b5fd 40%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(139,92,246,.6));text-align:center}
.tag{text-align:center;color:var(--mute);margin:6px 0 22px}
.tabs{display:flex;gap:6px;padding:5px;border-radius:16px;background:rgba(0,0,0,.25);margin-bottom:18px}
.tabs button{flex:1;padding:10px;border-radius:12px;font-weight:700;color:var(--mute)}
.tabs button.on{background:rgba(255,255,255,.14);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.field{margin-bottom:14px}
.err{color:var(--red);min-height:22px;margin-bottom:8px;font-size:14px}

/* каркас */
header.top{position:sticky;top:10px;z-index:20;margin:10px auto 0;width:min(1100px,calc(100% - 20px));display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:22px}
.brand{font-size:20px}
.nav{display:flex;gap:4px;margin:0 auto}
.nav button{padding:9px 18px;border-radius:14px;font-weight:700;color:var(--mute);transition:.15s}
.nav button.on{background:rgba(255,255,255,.14);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.me{display:flex;align-items:center;gap:10px}
.bal{padding:8px 16px;border-radius:999px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.45);box-shadow:0 0 20px rgba(52,211,153,.25);font-family:Unbounded,sans-serif;font-weight:700;color:var(--mint);transition:transform .3s}
.bal.pop{transform:scale(1.12)}
.uname{color:var(--mute);font-weight:600}
main{width:min(1100px,calc(100% - 20px));margin:18px auto 40px}
.view{display:none}.view.on{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* игры */
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.gbtn{padding:16px 10px;border-radius:20px;text-align:center;font-weight:800;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:.2s}
.gbtn span{display:block;font-size:30px;margin-bottom:2px}
.gbtn.on{background:linear-gradient(135deg,rgba(139,92,246,.4),rgba(34,211,238,.25));border-color:var(--cyan);box-shadow:0 0 28px rgba(34,211,238,.35)}
.play{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
.stage{display:none;min-height:240px;place-items:center;text-align:center}
.stage.on{display:grid}
.stage-in{width:100%}
.reels{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
.reel{width:min(96px,26vw);aspect-ratio:.8;display:grid;place-items:center;font-size:clamp(38px,11vw,56px);border-radius:20px;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(255,255,255,.08));border:1px solid var(--line);box-shadow:inset 0 0 24px rgba(139,92,246,.4)}
.spin{filter:blur(1.5px)}
.rball{width:130px;height:130px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font:700 44px Unbounded,sans-serif;border:3px solid rgba(255,255,255,.35);transition:background .2s}
.rball.red{background:radial-gradient(circle at 30% 25%,#ff8aa0,#e11d48 70%);box-shadow:0 0 36px rgba(251,75,106,.6)}
.rball.black{background:radial-gradient(circle at 30% 25%,#4b4b66,#12121d 70%);box-shadow:0 0 30px rgba(139,92,246,.4)}
.rball.green{background:radial-gradient(circle at 30% 25%,#6ee7b7,#059669 70%);box-shadow:0 0 36px rgba(52,211,153,.6)}
.rch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#rnumWrap{margin-top:10px;max-width:160px;margin-inline:auto}
.droll{font:700 clamp(56px,16vw,84px) Unbounded,sans-serif;line-height:1;text-shadow:0 0 30px rgba(34,211,238,.6);margin-bottom:10px}
.dinfo{display:flex;gap:18px;justify-content:center;color:var(--mute);margin:6px 0 12px}
.dinfo b{color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--cyan);margin:10px 0}
.hint{font-size:13px;color:var(--mute);margin-top:12px}
.betrow{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.result{margin-top:14px;min-height:54px;padding:12px 14px;border-radius:16px;text-align:center;font-weight:700;display:none}
.result.win{display:block;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.5);color:var(--mint);box-shadow:0 0 24px rgba(52,211,153,.25)}
.result.lose{display:block;background:rgba(251,75,106,.12);border:1px solid rgba(251,75,106,.45);color:var(--red)}
.result small{display:block;font-weight:600;color:var(--mute);margin-top:2px}

/* банк */
.debt{font:700 38px Unbounded,sans-serif;color:var(--pink);text-shadow:0 0 24px rgba(244,114,182,.5);margin:6px 0}
.ok{font:700 26px Unbounded,sans-serif;color:var(--mint);margin:6px 0}
.loans{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.loans .btn{flex-direction:column;gap:0;padding:12px 8px}
.loans small{font-weight:600;opacity:.85}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.22)}
.stat b{display:block;font-size:18px}
h2{font-size:18px;margin-bottom:6px}
ul.rules{padding-left:18px;color:var(--mute);font-size:14px}

/* топы */
.ttabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.ttabs::-webkit-scrollbar{display:none}
.ttabs .chip{white-space:nowrap}
.lb{list-style:none;padding:0}
.lb li{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;margin-bottom:8px;background:rgba(0,0,0,.2)}
.lb li.you{background:rgba(139,92,246,.22);border:1px solid var(--violet)}
.rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px Unbounded,sans-serif;background:rgba(255,255,255,.08)}
.lb li:nth-child(1) .rk{background:#fbbf24;color:#2a1a00;box-shadow:0 0 18px rgba(251,191,36,.6)}
.lb li:nth-child(2) .rk{background:#cbd5e1;color:#111}
.lb li:nth-child(3) .rk{background:#d6845a;color:#1c0d03}
.lb .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.lb .vl{font-family:Unbounded,sans-serif;font-weight:500;color:var(--cyan)}
.empty{text-align:center;color:var(--mute);padding:26px 0}

#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:8px;width:min(420px,calc(100% - 24px))}
.toast{padding:12px 16px;border-radius:16px;font-weight:600;text-align:center;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);background:rgba(20,18,40,.8);border:1px solid var(--line);animation:tin .25s}
.toast.err{border-color:rgba(251,75,106,.6);color:#ffb3c0}
.toast.ok{border-color:rgba(52,211,153,.6);color:#a7f3d0}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

@media(max-width:760px){
  .grid2,.play{grid-template-columns:1fr}
  header.top{top:6px;padding:8px 12px}
  .uname{display:none}
  .nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));margin:0;padding:6px;justify-content:space-around;border-radius:22px;background:rgba(20,18,40,.7);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);z-index:30}
  .nav button{flex:1}
  main{padding-bottom:84px}
  .pad{padding:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Вход -->
<div id="auth">
  <div class="authbox">
    <h1 class="logo">LUMEN</h1>
    <p class="tag">Казино на виртуальные доллары. Реальные деньги не нужны.</p>
    <div class="glass pad">
      <div class="tabs" id="authTabs">
        <button class="on" data-m="login">Вход</button>
        <button data-m="register">Регистрация</button>
      </div>
      <div class="field"><label for="u">Ник</label><input id="u" type="text" autocomplete="username" maxlength="16"></div>
      <div class="field"><label for="p">Пароль</label><input id="p" type="password" autocomplete="current-password"></div>
      <div class="err" id="authErr"></div>
      <button class="btn big" id="authBtn">Войти</button>
      <p class="hint" id="authHint" hidden>После регистрации вы получите $10 на старт.</p>
    </div>
  </div>
</div>

<!-- Приложение -->
<div id="app" hidden>
  <header class="top glass">
    <h2 class="brand disp" style="margin:0">LUMEN</h2>
    <nav class="nav" id="nav">
      <button class="on" data-v="games">Игры</button>
      <button data-v="bank">Банк</button>
      <button data-v="top">Топы</button>
    </nav>
    <div class="me">
      <span class="uname" id="uname"></span>
      <span class="bal" id="bal">$0.00</span>
      <button class="chip" id="logout" title="Выйти">Выйти</button>
    </div>
  </header>

  <main>
    <!-- Игры -->
    <section class="view on" id="v-games">
      <div class="picker" id="picker">
        <button class="gbtn on" data-g="slots"><span>🎰</span>Слоты</button>
        <button class="gbtn" data-g="roulette"><span>🎡</span>Рулетка</button>
        <button class="gbtn" data-g="dice"><span>🎲</span>Кости</button>
      </div>
      <div class="glass pad play">
        <div>
          <div class="stage on" data-s="slots"><div class="stage-in">
            <div class="reels"><div class="reel">🍒</div><div class="reel">🍋</div><div class="reel">🔔</div></div>
            <p class="hint">Три одинаковых: 🍒 ×5 · 🍋 ×8 · 🔔 ×15 · 💎 ×30 · 7️⃣ ×77.<br>Две вишни: ×1.2</p>
          </div></div>
          <div class="stage" data-s="roulette"><div class="stage-in">
            <div class="rball green" id="rball">0</div>
            <div class="rch" id="rch">
              <button class="chip on" data-t="red">Красное ×2</button>
              <button class="chip" data-t="black">Чёрное ×2</button>
              <button class="chip" data-t="even">Чётное ×2</button>
              <button class="chip" data-t="odd">Нечётное ×2</button>
              <button class="chip" data-t="low">1–18 ×2</button>
              <button class="chip" data-t="high">19–36 ×2</button>
              <button class="chip" data-t="number">Число ×36</button>
            </div>
            <div id="rnumWrap" hidden><label for="rnum">Число от 0 до 36</label><input id="rnum" type="number" min="0" max="36" step="1" value="7"></div>
          </div></div>
          <div class="stage" data-s="dice"><div class="stage-in">
            <div class="droll" id="droll">50</div>
            <div class="rch" id="dmode">
              <button class="chip on" data-m="under">Меньше</button>
              <button class="chip" data-m="over">Больше</button>
            </div>
            <input id="dt" type="range" min="5" max="96" step="1" value="50" aria-label="Цель">
            <div class="dinfo"><span>Цель: <b id="dtv">50</b></span><span>Шанс: <b id="dch">49%</b></span><span>Выплата: <b id="dml">×1.98</b></span></div>
          </div></div>
        </div>
        <div>
          <label for="bet">Ставка</label>
          <div class="betrow"><button class="chip" data-c="half">½</button><input id="bet" type="number" inputmode="decimal" min="0.1" step="0.1" value="1"><button class="chip" data-c="x2">×2</button></div>
          <div class="chips" id="chips">
            <button class="chip" data-v="0.5">$0.5</button><button class="chip" data-v="1">$1</button><button class="chip" data-v="5">$5</button><button class="chip" data-v="10">$10</button><button class="chip" data-c="max">Всё</button>
          </div>
          <button class="btn big" id="play">Играть</button>
          <div class="result" id="result"></div>
        </div>
      </div>
    </section>

    <!-- Банк -->
    <section class="view" id="v-bank">
      <div class="grid2">
        <div class="glass pad">
          <h2>Кредит</h2>
          <div id="loanState"></div>
          <div class="loans" id="loans"></div>
          <div id="repayBox" hidden>
            <label for="ramt">Сумма погашения</label>
            <div class="row"><input id="ramt" type="number" min="0.01" step="0.01" placeholder="например, 5"><button class="btn ghost" id="repayPart">Погасить</button></div>
            <div class="row"><button class="btn" id="repayAll" style="width:100%">Погасить всё, что возможно</button></div>
          </div>
          <ul class="rules" style="margin-top:16px" id="rules"></ul>
        </div>
        <div style="display:grid;gap:18px;align-content:start">
          <div class="glass pad">
            <h2>Ежедневный бонус</h2>
            <p class="muted" id="bonusTxt"></p>
            <div class="row"><button class="btn" id="bonusBtn">Забрать бонус</button></div>
          </div>
          <div class="glass pad">
            <h2>Ваша статистика</h2>
            <div class="stats" id="stats"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Топы -->
    <section class="view" id="v-top">
      <div class="glass pad">
        <div class="ttabs" id="ttabs"></div>
        <ul class="lb" id="lb"></ul>
      </div>
    </section>
  </main>
</div>
<div id="toasts"></div>

<script>
/* ===== Настройка: вставьте URL веб-приложения Google Apps Script (оканчивается на /exec) ===== */
const API_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';

const SYM = ['🍒','🍋','🔔','💎','7️⃣'];
const REDS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const TOPS = [
  {k:'balance',t:'Богатейшие',f:n=>money(n)},
  {k:'biggestWin',t:'Крупнейший выигрыш',f:n=>money(n)},
  {k:'totalWon',t:'Всего выиграно',f:n=>money(n)},
  {k:'playSeconds',t:'Время в игре',f:n=>fmtTime(n)},
  {k:'games',t:'Сыграно партий',f:n=>String(n)},
  {k:'debt',t:'Должники',f:n=>money(n)}
];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const money = n => '$' + Number(n).toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} ч ${m} мин`:m?`${m} мин`:`${s} сек`}
const colorOf = n => n===0?'green':REDS.includes(n)?'red':'black';

let session = null;
try { session = JSON.parse(localStorage.getItem('lumen_session')); } catch(e) {}
let S = null, CONF = {loanOptions:[10,25,50,100],loanRate:.3,autoRepay:.3,minBet:.1,maxBet:1000,dailyBonus:5};
let authMode='login', game='slots', rChoice='red', dMode='under', topKey='balance', busy=false, bonusAt=0, hb=null, lbTimer=null, view='games';

/* ---------- API ---------- */
async function api(action, data={}) {
  if (API_URL.startsWith('PASTE')) throw new Error('Укажите URL веб-приложения в константе API_URL');
  const body = {action, ...data};
  if (session && !('user' in data)) { body.user = session.user; body.token = session.token; }
  let j;
  try {
    const res = await fetch(API_URL, {method:'POST', body:JSON.stringify(body)}); // text/plain: без CORS-preflight
    j = await res.json();
  } catch(e) { throw new Error('Нет связи с сервером'); }
  if (!j.ok) {
    if (/Сессия истекла/.test(j.error||'')) logout(true);
    throw new Error(j.error || 'Ошибка сервера');
  }
  return j;
}

function toast(msg, type='ok') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3600);
}

/* ---------- Вход ---------- */
$('#authTabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  authMode = b.dataset.m;
  $$('#authTabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#authBtn').textContent = authMode==='login' ? 'Войти' : 'Создать аккаунт';
  $('#authHint').hidden = authMode==='login';
  $('#p').autocomplete = authMode==='login' ? 'current-password' : 'new-password';
  $('#authErr').textContent = '';
};
async function submitAuth() {
  const user = $('#u').value.trim(), pass = $('#p').value;
  $('#authErr').textContent = ''; $('#authBtn').disabled = true;
  try {
    const j = await api(authMode, {user, pass});
    session = {user: j.state.username, token: j.token};
    localStorage.setItem('lumen_session', JSON.stringify(session));
    CONF = j.config; enter(j.state);
    if (authMode==='register') toast('Добро пожаловать! На счёте $10', 'ok');
  } catch(e) { $('#authErr').textContent = e.message; }
  $('#authBtn').disabled = false;
}
$('#authBtn').onclick = submitAuth;
$('#p').onkeydown = $('#u').onkeydown = e => { if (e.key==='Enter') submitAuth(); };

function enter(state) {
  $('#auth').hidden = true; $('#app').hidden = false;
  applyState(state);
  clearInterval(hb);
  hb = setInterval(async () => {
    if (!session || document.hidden || busy) return;
    try { applyState((await api('me')).state); } catch(e) {}
  }, 30000);
  buildTops(); updateDice(); openView(view);
}
function logout(silent) {
  session = null; localStorage.removeItem('lumen_session'); clearInterval(hb); clearInterval(lbTimer);
  $('#app').hidden = true; $('#auth').hidden = false; $('#p').value = '';
  if (silent === true) $('#authErr').textContent = 'Сессия истекла, войдите заново';
}
$('#logout').onclick = () => logout();

/* ---------- Состояние ---------- */
function applyState(s) {
  const prev = S ? S.balance : s.balance;
  S = s;
  $('#bal').textContent = money(s.balance);
  $('#uname').textContent = s.username;
  if (s.balance !== prev) { const b = $('#bal'); b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 300); }
  bonusAt = Date.now() + s.bonusIn;
  renderBank();
}

/* ---------- Навигация ---------- */
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) openView(b.dataset.v); };
function openView(v) {
  view = v;
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $$('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  clearInterval(lbTimer);
  if (v === 'top') { loadTops(); lbTimer = setInterval(loadTops, 30000); }
}

/* ---------- Игры ---------- */
$('#picker').onclick = e => {
  const b = e.target.closest('.gbtn'); if (!b || busy) return;
  game = b.dataset.g;
  $$('.gbtn').forEach(x => x.classList.toggle('on', x === b));
  $$('.stage').forEach(x => x.classList.toggle('on', x.dataset.s === game));
  $('#result').className = 'result';
};
function getBet(){ return Math.round(parseFloat($('#bet').value) * 100) / 100; }
function setBet(v){ $('#bet').value = Math.max(0, Math.min(CONF.maxBet, Math.floor(v*100)/100)); }
$('#bet').parentElement.onclick = e => {
  const c = e.target.closest('[data-c]'); if (!c) return;
  const b = getBet() || 0;
  if (c.dataset.c==='half') setBet(Math.max(CONF.minBet, b/2)); else if (c.dataset.c==='x2') setBet(b*2);
};
$('#chips').onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  if (c.dataset.c==='max') setBet(S.balance); else setBet(parseFloat(c.dataset.v));
};
$('#rch').onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  rChoice = c.dataset.t;
  $$('#rch .chip').forEach(x => x.classList.toggle('on', x === c));
  $('#rnumWrap').hidden = rChoice !== 'number';
};
$('#dmode').onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  dMode = c.dataset.m;
  $$('#dmode .chip').forEach(x => x.classList.toggle('on', x === c));
  updateDice();
};
$('#dt').oninput = updateDice;
function updateDice() {
  const t = +$('#dt').value, ch = dMode==='under' ? (t-1)/100 : (100-t)/100;
  $('#dtv').textContent = (dMode==='under' ? '< ' : '> ') + t;
  $('#dch').textContent = Math.round(ch*100) + '%';
  $('#dml').textContent = '×' + (0.97/ch).toFixed(2);
}

const ANIM = {
  async slots(p) {
    const reels = $$('.reel'), t0 = Date.now();
    reels.forEach(r => r.classList.add('spin'));
    const tm = reels.map(r => setInterval(() => r.textContent = SYM[Math.random()*5|0], 70));
    let j;
    try { j = await p; } catch(e) { tm.forEach(clearInterval); reels.forEach(r => r.classList.remove('spin')); throw e; }
    for (let i = 0; i < 3; i++) {
      await sleep(Math.max(0, 700 + i*380 - (Date.now() - t0)));
      clearInterval(tm[i]); reels[i].classList.remove('spin'); reels[i].textContent = SYM[j.result.reels[i]];
    }
    return j;
  },
  async roulette(p) {
    const el = $('#rball'), t0 = Date.now();
    const tm = setInterval(() => { const n = Math.random()*37|0; el.textContent = n; el.className = 'rball spin ' + colorOf(n); }, 60);
    try {
      const j = await p; await sleep(Math.max(0, 1500 - (Date.now() - t0)));
      el.textContent = j.result.number; el.className = 'rball ' + j.result.color; return j;
    } catch(e) { el.className = 'rball green'; throw e; }
    finally { clearInterval(tm); }
  },
  async dice(p) {
    const el = $('#droll'), t0 = Date.now();
    const tm = setInterval(() => el.textContent = (Math.random()*100|0) + 1, 55);
    try { const j = await p; await sleep(Math.max(0, 1000 - (Date.now() - t0))); el.textContent = j.result.roll; return j; }
    finally { clearInterval(tm); }
  }
};

$('#play').onclick = async () => {
  if (busy) return;
  const bet = getBet();
  if (!(bet >= CONF.minBet)) return toast('Минимальная ставка ' + money(CONF.minBet), 'err');
  if (bet > S.balance) return toast('Недостаточно средств. Возьмите кредит или заберите бонус в разделе «Банк»', 'err');
  const params = game==='roulette' ? {type:rChoice, number:+$('#rnum').value}
               : game==='dice' ? {mode:dMode, target:+$('#dt').value} : {};
  busy = true; $('#play').disabled = true; $('#result').className = 'result';
  const p = api('play', {game, bet, params}); p.catch(() => {});
  try {
    const j = await ANIM[game](p);
    applyState(j.state); showResult(j);
  } catch(e) { toast(e.message, 'err'); }
  busy = false; $('#play').disabled = false;
};

function showResult(j) {
  const r = j.result, el = $('#result'), win = j.profit > 0;
  let detail = '';
  if (game==='slots') detail = r.reels.map(i => SYM[i]).join(' ');
  else if (game==='roulette') detail = `Выпало ${r.number} (${{red:'красное',black:'чёрное',green:'зеро'}[r.color]})`;
  else detail = `Выпало ${r.roll}, нужно ${dMode==='under'?'меньше':'больше'} ${$('#dt').value}`;
  let extra = j.repaid > 0 ? `<small>На кредит автоматически ушло ${money(j.repaid)}</small>` : '';
  el.className = 'result ' + (win ? 'win' : 'lose');
  el.innerHTML = (win ? `Выигрыш +${money(j.profit)}` : `Проигрыш −${money(j.bet)}`) + `<small>${esc(detail)}</small>` + extra;
}

/* ---------- Банк ---------- */
function renderBank() {
  if (!S) return;
  const L = S.loan;
  $('#loanState').innerHTML = L
    ? `<p class="muted">Осталось вернуть</p><div class="debt">${money(L.due)}</div><p class="muted">Взято ${money(L.principal)}. Пока долг не закрыт, новый кредит недоступен.</p>`
    : `<div class="ok">Долгов нет</div><p class="muted">Выберите сумму — при возврате добавится ${Math.round(CONF.loanRate*100)}%.</p>`;
  $('#loans').innerHTML = CONF.loanOptions.map(a =>
    `<button class="btn ghost" data-a="${a}" ${L?'disabled':''}>Взять ${money(a).replace('.00','')}<small>вернуть ${money(a*(1+CONF.loanRate)).replace('.00','')}</small></button>`).join('');
  $('#repayBox').hidden = !L;
  $('#rules').innerHTML = `<li>${Math.round(CONF.autoRepay*100)}% чистого выигрыша автоматически идёт на погашение кредита.</li><li>Погашать можно частями в любой момент.</li><li>Новый кредит — только после полного возврата старого.</li>`;
  const wr = S.games ? Math.round(S.wins / S.games * 100) : 0;
  const st = [['Партий',S.games],['Побед',`${S.wins} (${wr}%)`],['Поставлено',money(S.totalWagered)],['Выиграно',money(S.totalWon)],['Лучший выигрыш',money(S.biggestWin)],['Время в игре',fmtTime(S.playSeconds)]];
  $('#stats').innerHTML = st.map(([k,v]) => `<div class="stat"><span class="muted">${k}</span><b>${esc(v)}</b></div>`).join('');
  tickBonus();
}
$('#loans').onclick = async e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  try { const j = await api('takeLoan', {amount: +b.dataset.a}); applyState(j.state); toast('Кредит выдан: ' + money(b.dataset.a)); }
  catch(err) { toast(err.message, 'err'); }
};
async function repay(amount) {
  try { const j = await api('repayLoan', {amount}); applyState(j.state); toast('Погашено ' + money(j.repaid)); $('#ramt').value = ''; }
  catch(err) { toast(err.message, 'err'); }
}
$('#repayAll').onclick = () => repay('all');
$('#repayPart').onclick = () => repay(+$('#ramt').value);
$('#bonusBtn').onclick = async () => {
  try { const j = await api('bonus'); applyState(j.state); toast('Бонус +' + money(j.bonus)); }
  catch(err) { toast(err.message, 'err'); }
};
function tickBonus() {
  const left = bonusAt - Date.now(), b = $('#bonusBtn');
  b.disabled = left > 0;
  if (left > 0) {
    const h = Math.floor(left/3600000), m = Math.floor(left%3600000/60000), s = Math.floor(left%60000/1000);
    $('#bonusTxt').textContent = `Следующий бонус через ${h} ч ${m} мин ${s} с.`;
  } else $('#bonusTxt').textContent = `Раз в сутки можно забрать ${money(CONF.dailyBonus)}. Пригодится, если баланс на нуле.`;
}
setInterval(() => { if (view==='bank' && S) tickBonus(); }, 1000);

/* ---------- Топы ---------- */
function buildTops() {
  $('#ttabs').innerHTML = TOPS.map(t => `<button class="chip ${t.k===topKey?'on':''}" data-k="${t.k}">${t.t}</button>`).join('');
}
$('#ttabs').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  topKey = b.dataset.k; buildTops(); renderTops();
};
let boards = null;
async function loadTops() {
  try {
    const res = await fetch(API_URL + '?action=leaderboard'); const j = await res.json();
    if (j.ok) { boards = j.boards; renderTops(); }
  } catch(e) { if (!boards) $('#lb').innerHTML = '<li class="empty">Не удалось загрузить рейтинг</li>'; }
}
function renderTops() {
  const cfg = TOPS.find(t => t.k === topKey), list = boards && boards[topKey];
  if (!list) return;
  $('#lb').innerHTML = list.length ? list.map((r,i) =>
    `<li class="${session && r.name.toLowerCase()===session.user.toLowerCase()?'you':''}"><span class="rk">${i+1}</span><span class="nm">${esc(r.name)}</span><span class="vl">${esc(cfg.f(r.value))}</span></li>`).join('')
    : '<li class="empty">Здесь пока никого. Станьте первым.</li>';
}

/* ---------- Старт ---------- */
(async function init() {
  if (!session) return;
  try { const j = await api('me'); CONF = j.config || CONF; enter(j.state); }
  catch(e) { logout(); }
})();
</script>
</body>
</html>
